name: Build and deploy Python app to Azure Web App - emble-ai-interviewer

on:
  push:
    branches:
      - main
    paths:
      - ai-interviewer/**
      - .github/workflows/main_emble-ai-interviewer.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (ai-interviewer)
        working-directory: ai-interviewer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import (ai-interviewer)
        working-directory: ai-interviewer
        run: |
          python -c "import app.main"

      - name: Prepare deployment package (ai-interviewer)
        run: |
          rm -rf ai-interviewer-deploy
          mkdir -p ai-interviewer-deploy
          cp -R ai-interviewer/. ai-interviewer-deploy/
          rm -rf ai-interviewer-deploy/.venv ai-interviewer-deploy/__pycache__

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ai-interviewer-app
          path: ai-interviewer-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ai-interviewer-app
          path: ai-interviewer-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_269182980397404CA14511E2E99EBDA0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3E8524554A3F49D789086CA442A180A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_49B2BC15853E409CA30C37C02A8304FF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'emble-ai-interviewer'
          slot-name: 'Production'
          package: ai-interviewer-deploy
          startup-command: 'python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8002}'
