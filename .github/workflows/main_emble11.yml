# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Emble11

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install, build, and test (backend)
        working-directory: backend
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Prepare deployment package (backend)
        working-directory: backend
        run: |
          npm prune --omit=dev
          rm -rf deploy
          mkdir -p deploy
          cp -R dist deploy/
          cp package.json package-lock.json deploy/
          cp -R node_modules deploy/
          if [ -f ../dataset.json ]; then cp ../dataset.json deploy/; fi
          if [ -f ../sql_dataset.json ]; then cp ../sql_dataset.json deploy/; fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend-deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_269182980397404CA14511E2E99EBDA0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3E8524554A3F49D789086CA442A180A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_49B2BC15853E409CA30C37C02A8304FF }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Emble11'
          slot-name: 'Production'
          package: backend-deploy
          startup-command: 'sh -c "npm run migration:run:prod && npm run start:prod"'
            
