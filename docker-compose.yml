services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: college_prep_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.development
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://admin:password@postgres:5432/college_prep_db?sslmode=disable
      PGHOST: postgres
      PGPORT: 5432
      NEST_CLI_CONFIG: /app/nest-cli.json
      SKIP_CLEAN_DIST: true
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/cross-env ]; then npm ci; fi; npm run dev"]
    volumes:
      - ./backend:/app
      - ./dataset.json:/app/dataset.json:ro
      - ./sql_dataset.json:/app/sql_dataset.json:ro
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
    networks:
      - college_prep_network

  postgres:
    image: postgres:15-alpine
    container_name: college_prep_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: college_prep_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - college_prep_network




networks:
  college_prep_network:
    driver: bridge

volumes:
  backend_node_modules:
  postgres_data:
