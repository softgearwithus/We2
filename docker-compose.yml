version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: college_prep_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: college_prep_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - college_prep_network

  redis:
    image: redis:7-alpine
    container_name: college_prep_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - college_prep_network

networks:
  college_prep_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
