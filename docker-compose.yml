services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_prep_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEST_CLI_CONFIG: /app/nest-cli.json
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - college_prep_network

  postgres:
    image: postgres:15-alpine
    container_name: college_prep_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: college_prep_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - college_prep_network

  redis:
    image: redis:7-alpine
    container_name: college_prep_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - college_prep_network

networks:
  college_prep_network:
    driver: bridge

volumes:
  backend_node_modules:
  postgres_data:
  redis_data:
