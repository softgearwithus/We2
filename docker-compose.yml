services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: college_prep_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.development
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://admin:password@postgres:5432/college_prep_db?sslmode=disable
      PGHOST: postgres
      PGPORT: 5432
      AI_INTERVIEW_BASE_URL: http://ai_interviewer:8002
      NEST_CLI_CONFIG: /app/nest-cli.json
      SKIP_CLEAN_DIST: true
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/cross-env ]; then npm ci; fi; npm run dev"]
    volumes:
      - ./backend:/app
      - ./dataset.json:/app/dataset.json:ro
      - ./sql_dataset.json:/app/sql_dataset.json:ro
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
      - ai_interviewer
    networks:
      - college_prep_network

  ai_interviewer:
    build:
      context: ./ai-interviewer
      dockerfile: Dockerfile
    container_name: college_prep_ai_interviewer
    ports:
      - "8002:8002"
    environment:
      AI_INTERVIEW_ENVIRONMENT: development
      AI_INTERVIEW_INTERNAL_KEY: local-internal
      AI_INTERVIEW_JWT_SECRET: dev-secret
      AI_INTERVIEW_POSTGRES_DSN: postgresql+asyncpg://admin:password@postgres:5432/college_prep_db
      AI_INTERVIEW_REDIS_URL: redis://redis:6379/0
      # Optional: provide these to enable LLM + embeddings
      AI_INTERVIEW_AZURE_OPENAI_ENDPOINT: ${AI_INTERVIEW_AZURE_OPENAI_ENDPOINT:-}
      AI_INTERVIEW_AZURE_OPENAI_KEY: ${AI_INTERVIEW_AZURE_OPENAI_KEY:-}
      AI_INTERVIEW_AZURE_OPENAI_API_VERSION: ${AI_INTERVIEW_AZURE_OPENAI_API_VERSION:-2024-05-01-preview}
      AI_INTERVIEW_AZURE_OPENAI_CHAT_DEPLOYMENT: ${AI_INTERVIEW_AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o-mini}
      AI_INTERVIEW_AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AI_INTERVIEW_AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      AI_INTERVIEW_LLAMA_PARSE_API_KEY: ${AI_INTERVIEW_LLAMA_PARSE_API_KEY:-}
      AI_INTERVIEW_QDRANT_URL: ${AI_INTERVIEW_QDRANT_URL:-http://qdrant:6333}
      AI_INTERVIEW_QDRANT_API_KEY: ${AI_INTERVIEW_QDRANT_API_KEY:-}
      AI_INTERVIEW_QDRANT_COLLECTION: ${AI_INTERVIEW_QDRANT_COLLECTION:-resume_claims}
    depends_on:
      - postgres
      - redis
    networks:
      - college_prep_network

  postgres:
    image: postgres:15-alpine
    container_name: college_prep_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: college_prep_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - college_prep_network

  redis:
    image: redis:7-alpine
    container_name: college_prep_redis
    ports:
      - "6379:6379"
    networks:
      - college_prep_network

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: college_prep_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - college_prep_network



networks:
  college_prep_network:
    driver: bridge

volumes:
  backend_node_modules:
  postgres_data:
  qdrant_data:
